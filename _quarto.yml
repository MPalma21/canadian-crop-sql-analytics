project:
  type: website
  output-dir: _site

website:
  title: "Canadian Crop SQL Analytics"
  description: "Reproducible Canadian crop production, farm-price and FX analytics."
  site-url: "https://mpalma21.github.io/canadian-crop-sql-analytics/"
  repo-url: "https://github.com/MPalma21/canadian-crop-sql-analytics"
  repo-actions: [source, issue]
  navbar:
    pinned: true
    left:
      - href: index.qmd
        text: English
      - href: es/index.qmd
        text: Español
      - text: Documentation
        menu:
          - href: docs/architecture.md
            text: Architecture
          - href: docs/data-dictionary.md
            text: Data dictionary
    right:
      - icon: github
        href: "https://github.com/MPalma21/canadian-crop-sql-analytics"
        aria-label: GitHub repository
  page-footer:
    left: "© 2026 Miguelangel Palma Rojas · MIT License"
    right: "Built with R, SQLite and Quarto"
  open-graph: true
  twitter-card: true
  search: true

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: assets/styles.css
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    code-copy: true
    include-after-body: assets/code-tools-fix.html
    smooth-scroll: true
    fig-responsive: true
    link-external-newwindow: true

execute:
  freeze: auto
  warning: false
  message: false
